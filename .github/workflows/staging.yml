name: Staging Environment

on:
  push:
    branches: [master]

jobs:
  print_env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Print Environment Variables
        run: |
          echo "Environment: staging"
          echo "ENV_VAR_1: ${{ env.ENV_VAR_1 }}"
          echo "ENV_1: ${{ secrets.ENV_1 }}"
