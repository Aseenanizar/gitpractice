name: Test Environment Variables and Secrets

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Print Environment Variables and Secrets
        run: |
          echo "Environment Variable (ENV_VAR_1): ${{ env.ENV_VAR_1 }}"
          echo "Secret (ENV_1): ${{ secrets.ENV_1 }}"
          # Use the secret in a command
          echo "Using the secret: $(echo "${{ secrets.ENV_1 }}" | base64 -d)"
